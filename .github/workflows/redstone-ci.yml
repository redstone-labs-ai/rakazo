name: redstone-ci

# Upstream's ci.yml targets main and deploys upstream production, so it is disabled in this
# fork. This runs the same lint, typecheck and unit suite for redstone and its pull requests.
on:
  pull_request:
    branches: [redstone]
  push:
    branches: [redstone]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redstone-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      # Check Expo packages against the installed SDK, not the newest patches Expo has
      # published since: this fork takes those with upstream syncs. Turbo's strict env mode
      # would drop EXPO_OFFLINE before it reaches the mobile check.
      - run: pnpm check --env-mode=loose
        env:
          EXPO_OFFLINE: "1"

  unit:
    name: Unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - run: pnpm run test --shard=${{ matrix.shard }}/3
